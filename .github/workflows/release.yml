name: release

on:
  push:
    tags: ['v*']

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: release
    permissions:
      id-token: write     # OIDC exchange — required
      contents: read      # setting any permissions zeroes the rest
    steps:
      - uses: actions/checkout@v7
      - uses: rust-lang/crates-io-auth-action@v1
        id: auth
      # GitHub's push-event delivery is at-least-once, so a duplicate
      # delivery for the same tag can race two runs of this job. crates.io
      # rejects the loser with "already uploaded"/"already exists"; treat
      # that as a no-op instead of a failed run.
      - name: Publish to crates.io
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
        run: |
          set +e
          output=$(cargo publish 2>&1)
          status=$?
          echo "$output"
          if [ $status -eq 0 ]; then
            exit 0
          fi
          if echo "$output" | grep -qE 'already (uploaded|exists)'; then
            echo "::notice::Version already published to crates.io; treating as no-op."
            exit 0
          fi
          exit $status
