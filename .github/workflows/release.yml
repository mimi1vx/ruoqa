name: release

# Backfill path only: automated releases publish from release-plz.yml, in the
# same job that cuts the tag. This covers hand-pushed tags and retrying a
# version whose publish failed after the tag already existed. Both workflow
# filenames are registered as crates.io trusted publishers — dropping either
# config breaks the corresponding path with a 400 at token exchange.
on:
  workflow_dispatch:
    inputs:
      ref:
        description: Tag to publish from, e.g. v0.1.2.
        required: true
        type: string
  push:
    tags: ['v*']

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: release
    permissions:
      id-token: write     # OIDC exchange — required
      contents: read      # setting any permissions zeroes the rest
    steps:
      - uses: actions/checkout@v7
        with:
          # Empty on `push`, where checkout falls back to the pushed tag.
          ref: ${{ inputs.ref }}
          persist-credentials: false
      - uses: rust-lang/crates-io-auth-action@v1
        id: auth
      # A retry, a hand-pushed tag racing the automated call, or GitHub's
      # at-least-once push delivery can run this job twice for one version.
      # crates.io rejects the loser with "already uploaded"/"already exists";
      # treat that as a no-op instead of a failed run.
      - name: Publish to crates.io
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
        run: |
          set +e
          output=$(cargo publish 2>&1)
          status=$?
          echo "$output"
          if [ $status -eq 0 ]; then
            exit 0
          fi
          if echo "$output" | grep -qE 'already (uploaded|exists)'; then
            echo "::notice::Version already published to crates.io; treating as no-op."
            exit 0
          fi
          exit $status
